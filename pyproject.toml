[build-system]
requires = ["setuptools>=42", "wheel", "cmake>=3.18", "ninja", "pybind11>=2.10.0"]
build-backend = "setuptools.build_meta"

[project]
name = "dtf"
version = "0.1.0"
description = "Minimal C++ NCCL communicator with Python bindings (early scaffold)"
authors = [{ name = "Naresh Kumar" }]
requires-python = ">=3.8"
dependencies = [
    "numpy",
    "torch>=2.0.0"
]

[project.optional-dependencies]
dev = [
    "pytest",
    "black",
    "flake8"
]

[tool.pytest.ini_options]
minversion = "6.0"
addopts = "-ra -q"
testpaths = [
    "tests",
]
